spring.application.name=a11y-ai-readiness

# Environment variables always win over this file (Spring Boot's normal precedence),
# so XAI_API_KEY / ANTHROPIC_API_KEY work without ever touching secrets.properties.
spring.config.import=optional:file:./secrets.properties

# xAI/Grok via Spring AI's OpenAI-compatible client
spring.ai.openai.api-key=${xai.api.key:}
spring.ai.openai.base-url=https://api.x.ai/v1
spring.ai.openai.chat.model=${agent.model:grok-4.6}
# Belt and braces: this property alone did NOT constrain anything (a real run went to 28 against
# a limit of 15), so the cap the results actually depend on is enforced in RegistrationAgentTools.
spring.ai.tools.limits.max-total-tool-calls=${agent.max.turns:30}
