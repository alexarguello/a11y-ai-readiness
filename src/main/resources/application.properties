spring.application.name=a11y-ai-readiness

# Environment variables always win over this file (Spring Boot's normal precedence),
# so XAI_API_KEY / ANTHROPIC_API_KEY work without ever touching secrets.properties.
spring.config.import=optional:file:./secrets.properties

# xAI/Grok via Spring AI's OpenAI-compatible client. The chat.model default here only matters if
# AgentRunner isn't overriding it per run -- it always is (see its DEFAULT_MODEL map), so this is
# effectively just documentation of what xai resolves to absent a --model= argument.
spring.ai.openai.api-key=${xai.api.key:}
spring.ai.openai.base-url=https://api.x.ai/v1
spring.ai.openai.chat.model=grok-4.6

# Anthropic, direct (not OpenAI-compatible -- its own starter/client)
spring.ai.anthropic.api-key=${anthropic.api.key:}
spring.ai.anthropic.chat.model=claude-sonnet-5

# Belt and braces: this property alone did NOT constrain anything (a real run went to 28 against
# a limit of 15), so the cap the results actually depend on is enforced in RegistrationAgentTools.
spring.ai.tools.limits.max-total-tool-calls=${agent.max.turns:40}
